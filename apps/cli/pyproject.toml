[project]
name = "engram-cli"
version = "0.1.0"
description = "The engram command-line interface."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
    "engram-storage-sqlite",
    "engram-export-git",
    "typer>=0.27.1",
    "pydantic-settings>=2.7.0",
]

[project.scripts]
engram = "engram_cli.main:run"

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }
engram-storage-sqlite = { workspace = true }
engram-export-git = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_cli"]
