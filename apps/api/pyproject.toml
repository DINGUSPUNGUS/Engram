[project]
name = "engram-api"
version = "0.1.0"
description = "engram REST API: a thin FastAPI shell over the application services."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
    "engram-storage-sqlite",
    "engram-export-git",
    "fastapi>=0.141.1",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }
engram-storage-sqlite = { workspace = true }
engram-export-git = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_api"]
