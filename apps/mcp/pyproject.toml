[project]
name = "engram-mcp"
version = "0.1.0"
description = "engram MCP server (roadmap phase 7 — deliberately empty)."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_mcp"]
