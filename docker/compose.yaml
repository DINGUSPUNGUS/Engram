# Optional convenience. engram is local-first: `pnpm dev` needs no containers.
# From the repo root:  docker compose -f docker/compose.yaml up --build
name: engram

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The user's memory lives OUTSIDE the container, always.
      - ${ENGRAM_DATA_DIR:-~/.engram}:/data
    environment:
      ENGRAM_LOG_FORMAT: json

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    depends_on:
      - api
