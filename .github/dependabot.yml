version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned: newer prebuilt binaries crash on CPUs without newer instruction
      # sets (see ADR-0006). Bump deliberately, test on Windows.
      - dependency-name: turbo

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      py-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
