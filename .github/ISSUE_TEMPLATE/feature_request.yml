name: Feature request
description: Propose new behavior
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >-
        Sketch the behavior. If it changes storage, events, or package boundaries,
        say so — it may need an ADR.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core/domain, storage, export/git, api, cli, mcp, web, docs, ci/tooling]
