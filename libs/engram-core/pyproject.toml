[project]
name = "engram-core"
version = "0.1.0"
description = "engram domain model and application services (pure — no I/O, no frameworks)."
requires-python = ">=3.13"
dependencies = [
    "engram-events",
]

[tool.uv.sources]
engram-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_core"]
