[project]
name = "engram-export-git"
version = "0.1.0"
description = "Markdown + NDJSON export projector, git committer, and inbound reconciler."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
    "gitpython>=3.1.59",
    "pyyaml>=6.0.2",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_export_git"]
