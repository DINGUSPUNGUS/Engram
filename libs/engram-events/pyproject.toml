[project]
name = "engram-events"
version = "0.1.0"
description = "engram kernel: event envelope, registry, bus, store and projection contracts."
requires-python = ">=3.13"
dependencies = [
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_events"]
