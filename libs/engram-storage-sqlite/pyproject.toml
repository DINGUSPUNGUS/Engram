[project]
name = "engram-storage-sqlite"
version = "0.1.0"
description = "Canonical engram store: SQLModel event log + state projections + Alembic migrations."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
    "sqlmodel>=0.0.24",
    "alembic>=1.14.0",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_storage_sqlite"]
