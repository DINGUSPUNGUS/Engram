[project]
name = "engram-assistants"
version = "0.1.0"
description = "engram assistant integration layer: the provider-agnostic gateway + wire-format adapters (ChatGPT, Claude, Gemini)."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
    "engram-intelligence",
]
# Deliberately NO vendor SDKs (ADR-0020): adapters translate wire SHAPES (JSON),
# they never call provider APIs — the assistant is the caller, engram is the tool.

[dependency-groups]
dev = [
    "engram-storage-sqlite",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }
engram-intelligence = { workspace = true }
engram-storage-sqlite = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_assistants"]
