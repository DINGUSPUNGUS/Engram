[project]
name = "engram-observatory"
version = "0.1.0"
description = "engram explainability: the audit graph that answers 'why did it do that?'"
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_observatory"]
