[project]
name = "engram-plugins"
version = "0.1.0"
description = "engram plugin architecture: capability-gated gateway + registry for third-party extensions (ADR-0024)."
requires-python = ">=3.13"
dependencies = [
    "engram-core",
    "engram-events",
]
# Deliberately NO engram-storage-sqlite, engram-export-git, or app packages:
# import-linter enforces that plugin code cannot reach the Event Store or
# bypass the application services (ADR-0024 §1).

[dependency-groups]
dev = [
    "engram-storage-sqlite",
]

[tool.uv.sources]
engram-core = { workspace = true }
engram-events = { workspace = true }
engram-storage-sqlite = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_plugins"]
